<div id="colLeft">
    <b>(Back lights):</b><br>
    <br>

    <div class="lightanim lightanim-1-.ctre.off_1000 lightanim-2-.ctre.off_1000"></div> Off<br>
    <div class="lightanim lightanim-1-.ctre.red_500-.ctre.off_500 lightanim-2-.ctre.off_500-.ctre.red_500"></div> No CAN<br>
    <div class="lightanim lightanim-1-.ctre.orange_500-.ctre.off_500 lightanim-2-.ctre.off_500-.ctre.orange_500"></div> No Phoenix<br>
    <div class="lightanim lightanim-1-.ctre.orange_500-.ctre.off_500 lightanim-2-.ctre.orange_500-.ctre.off_500"></div> Disabled<br>
    <br>

    <div class="lightanim lightanim-1-.ctre.orange_1000 lightanim-2-.ctre.orange_1000"></div> Enabled, not moving<br>
    <div class="lightanim lightanim-1-.ctre.red_250-.ctre.off_250 lightanim-2-.ctre.red_250-.ctre.off_250"></div> Enabled, moving backward<br>
    <div class="lightanim lightanim-1-.ctre.green_250-.ctre.off_250 lightanim-2-.ctre.green_250-.ctre.off_250"></div> Enabled, moving forward<br>
    <div class="lightanim lightanim-1-.ctre.off_750-.ctre.red_250 lightanim-2-.ctre.red_250-.ctre.off_750"></div> Forward limit reached<br>
    <div class="lightanim lightanim-1-.ctre.red_250-.ctre.off_750 lightanim-2-.ctre.off_750-.ctre.red_250"></div> Backward limit reached<br>
    <br>

    <div class="lightanim lightanim-1-.ctre.off_750-.ctre.orange_250 lightanim-2-.ctre.orange_250-.ctre.off_750"></div> Thermal fault<br>
    <div class="lightanim lightanim-1-.ctre.red_500-.ctre.green_500 lightanim-2-.ctre.green_500-.ctre.red_500"></div> Unlicensed, pro-only feature used<br>
    <div class="lightanim lightanim-1-.ctre.red_500-.ctre.orange_500 lightanim-2-.ctre.orange_500-.ctre.red_500"></div> Hardware fault<br>
    <div class="lightanim lightanim-1-.ctre.green_500-.ctre.orange_500 lightanim-2-.ctre.off_1000"></div> In bootloader<br>
    <br>
</div>
